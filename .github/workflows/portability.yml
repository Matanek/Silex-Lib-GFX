name: Validate GFX public API portability

run-name: Validate GFX public API (${{ inputs.target }})

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native SDL target to execute
        required: true
        type: choice
        default: all
        options:
          - all
          - linux-x64
          - windows-x64

permissions:
  contents: read

concurrency:
  group: gfx-portability-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

env:
  SILEX_CHECKPOINT: b9fce45a8eb5448a3d95ecdfe5057ba9f8cdaa21
  STD_CHECKPOINT: c5c4473400025fc348c2304150a1cce0fabe8e91

jobs:
  linux-x64:
    if: inputs.target == 'all' || inputs.target == 'linux-x64'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out GFX
        uses: actions/checkout@v6
        with:
          path: GFX

      - name: Check out the Silex compiler
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex
          ref: ${{ env.SILEX_CHECKPOINT }}
          path: _silex

      - name: Check out the exact STD checkpoint
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex-Lib-STD
          ref: ${{ env.STD_CHECKPOINT }}
          path: STD

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$archive"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Exercise the public GFX API on Linux X64
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          zig build -Doptimize=ReleaseFast -Dcpu=baseline \
            --prefix "$RUNNER_TEMP/silex-prefix" \
            --build-file _silex/Toolchain/build.zig
          silex="$RUNNER_TEMP/silex-prefix/bin/silex"
          consumer="$GITHUB_WORKSPACE/GFX/Tests/Consumer"
          "$silex" setup
          "$silex" link "$GITHUB_WORKSPACE/STD" --workspace "$consumer"
          "$silex" link "$GITHUB_WORKSPACE/GFX" --workspace "$consumer"
          output=$(cd "$consumer" && SDL_VIDEODRIVER=dummy "$silex" test Tests)
          printf '%s\n' "$output"
          grep -Fxq '1 passed; 0 failed in 1 files' <<< "$output"

  windows-x64:
    if: inputs.target == 'all' || inputs.target == 'windows-x64'
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out GFX
        uses: actions/checkout@v6
        with:
          path: GFX

      - name: Check out the Silex compiler
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex
          ref: ${{ env.SILEX_CHECKPOINT }}
          path: _silex

      - name: Check out the exact STD checkpoint
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex-Lib-STD
          ref: ${{ env.STD_CHECKPOINT }}
          path: STD

      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e") {
            throw "Zig archive checksum mismatch"
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-0.16.0")

      - name: Exercise the public GFX API on Windows X64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "home"
          $env:HOME = $env:USERPROFILE
          $env:SDL_VIDEODRIVER = "dummy"
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          zig build -Doptimize=ReleaseFast -Dcpu=baseline `
            --prefix "$env:RUNNER_TEMP/silex-prefix" `
            --build-file _silex/Toolchain/build.zig
          $silex = Join-Path $env:RUNNER_TEMP "silex-prefix/bin/silex.exe"
          $consumer = Join-Path $env:GITHUB_WORKSPACE "GFX/Tests/Consumer"
          & $silex setup
          & $silex link (Join-Path $env:GITHUB_WORKSPACE "STD") --workspace $consumer
          & $silex link (Join-Path $env:GITHUB_WORKSPACE "GFX") --workspace $consumer
          Set-Location $consumer
          $output = @(& $silex test Tests)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($exitCode -ne 0 -or -not ($output -contains "1 passed; 0 failed in 1 files")) {
            throw "GFX public API consumer failed"
          }
